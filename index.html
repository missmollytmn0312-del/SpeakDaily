<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Pro | Intelligent Scoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 pb-20 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <h1 class="font-bold text-slate-800 text-lg">Speaking Pro</h1>
            <div class="bg-orange-500 text-white px-4 py-1 rounded-full text-sm font-bold">
                🔥 <span id="streakCount">0</span> Day Streak
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 text-center">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 flex items-center justify-center min-h-[120px]">
                <p id="targetText" class="text-lg font-semibold text-indigo-900 leading-relaxed italic">"Press Next to start"</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="playAI()" class="bg-slate-100 hover:bg-slate-200 py-4 rounded-2xl font-bold text-slate-700 transition">🔊 Listen</button>
                <button id="micBtn" onclick="toggleRecording()" class="bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg transition-all">🎤 Record</button>
            </div>

            <button onclick="nextSentence()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-900 mb-6 transition">Next Sentence ➔</button>

            <div id="resultArea" class="hidden mt-4 pt-6 border-t border-slate-100 animate-in fade-in zoom-in duration-300">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pronunciation Accuracy</p>
                <div id="scoreText" class="text-5xl font-black text-blue-600 mb-4 tracking-tighter">0%</div>
                
                <div class="w-full bg-slate-200 rounded-full h-3 mb-4 overflow-hidden">
                    <div id="scoreBar" class="h-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                </div>
                
                <div class="bg-slate-50 p-3 rounded-lg border border-dashed border-slate-200">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">We Heard:</p>
                    <p id="userTranscript" class="text-sm text-slate-600 italic"></p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">📁 My Recordings</h3>
            <div id="gallery" class="space-y-4 max-h-60 overflow-y-auto italic text-xs text-slate-400 text-center">
                Practice a sentence to see your history!
            </div>
        </div>
    </div>
