<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Voice Conversation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22c55e;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: #1f2937;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui; margin:0; padding:20px; }
    .card { background: var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:20px; }
    button { padding:10px 16px; margin:6px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
    button.primary { background: var(--accent); color:white; }
    button.warn { background: var(--warn); color:#1f2937; }
    button.danger { background: var(--danger); color:white; }
    .sentence { font-size:1.1rem; background:#0b1222; padding:12px; border-radius:8px; }
    .heard .matched { color: var(--primary); font-weight:bold; }
    .heard .missed { color: var(--danger); }
  </style>
</head>
<body>
  <h1>Daily Voice Conversation</h1>
  <div class="card">
    <div><strong>Streak:</strong> <span id="streak">0</span> days</div>
    <div class="sentence" id="sentence">Loading…</div>
    <button id="btnSpeak" class="primary">Speak</button>
    <button id="btnNext" class="warn">Next</button>
    <button id="btnRecord">Record</button>
    <button id="btnDownload">Download</button>
  </div>
  <div class="card">
    <div><strong>Accuracy:</strong> <span id="score">0%</span></div>
    <div id="heardText" class="heard"></div>
    <audio id="audioPlayer" controls></audio>
  </div>

<script>
const sentences = [
  "Good morning! How are you today?",
  "I would like a cup of coffee, please.",
  "Can you help me find the nearest bus stop?",
  "The weather is warm and breezy.",
  "Let’s practice English for fifteen minutes.",
  "What time does the meeting start tomorrow?",
  "I’m learning Vietnamese and enjoying it."
];

const sentenceEl = document.getElementById("sentence");
const streakEl = document.getElementById("streak");
const heardEl = document.getElementById("heardText");
const scoreEl = document.getElementById("score");
const audioPlayer = document.getElementById("audioPlayer");

let currentSentence = "";
let recognition;
let mediaRecorder;
let chunks = [];
let recognizedText = "";

function getDateKey(d = new Date()) {
  return d.toISOString().slice(0,10);
}

function updateStreak() {
  const today = getDateKey();
  const last = localStorage.getItem("lastDate");
  let streak = parseInt(localStorage.getItem("streak") || "0");
  if (last !== today) {
    streak = last ? streak + 1 : 1;
    localStorage.setItem("lastDate", today);
    localStorage.setItem("streak", streak);
  }
  streakEl.textContent = streak;
}

function loadSentence() {
  const today = new Date(getDateKey());
  const idx = today.getDate() % sentences.length;
  currentSentence = sentences[idx];
  sentenceEl.textContent = currentSentence;
}

// --- Speech synthesis ---
function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  speechSynthesis.speak(utter);
}

// --- Recognition setup ---
function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "en-US";
  r.continuous = false;
  r.interimResults = false;
  r.onresult = e => {
    recognizedText = e.results[0][0].transcript;
    compareAccuracy(currentSentence, recognizedText);
  };
  return r;
}

// --- Accuracy scoring ---
function compareAccuracy(target, heard) {
  if (!heard) { scoreEl.textContent = "0%"; return; }
  const targetWords = target.toLowerCase().split(" ");
  const heardWords = heard.toLowerCase().split(" ");
  const matched = targetWords.filter(w => heardWords.includes(w));
  const percent = Math.round((matched.length / targetWords.length) * 100);
  scoreEl.textContent = percent + "%";
  heardEl.innerHTML = targetWords.map(w =>
    heardWords.includes(w) ? `<span class="matched">${w}</span>` : `<span class="missed">${w}</span>`
  ).join(" ");
}

// --- Recording ---
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);
      audioPlayer.src = url;
    };
    mediaRecorder.start();
    recognition = setupRecognition();
    if (recognition) recognition.start();
  } catch (err) {
    alert("Mic access failed. Use HTTPS and allow microphone.");
  }
}

// --- Event bindings ---
document.getElementById("btnSpeak").onclick = () => speak(currentSentence);
document.getElementById("btnNext").onclick = () => {
  currentSentence = sentences[(sentences.indexOf(currentSentence)+1)%sentences.length];
  sentenceEl.textContent = currentSentence;
  heardEl.innerHTML = "";
  scoreEl.textContent = "0%";
};
document.getElementById("btnRecord").onclick = startRecording;
document.getElementById("btnDownload").onclick = () => {
  if (!audioPlayer.src) { alert("No recording yet."); return; }
  const a = document.createElement("a");
  a.href = audioPlayer.src;
  a.download = "recording.webm";
  a.click();
};

// --- Initialize immediately ---
updateStreak();
loadSentence();
</script>
</body>
</html>
