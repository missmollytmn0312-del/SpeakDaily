<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Speaker | Universal Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex flex-col items-center justify-center font-sans">
    <div class="w-full max-w-md space-y-4">
        
        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <h1 class="font-bold text-slate-800 tracking-tight">HERO SPEAKER</h1>
                <div class="bg-orange-500 text-white px-3 py-1 rounded-full text-xs font-bold">🔥 <span id="streak">0</span></div>
            </div>

            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 text-center">
                <p id="targetText" class="text-xl font-bold text-indigo-900 leading-tight italic">
                    "I really appreciate your help with this project."
                </p>
            </div>

            <div class="space-y-3">
                <button onclick="playModel()" class="w-full bg-slate-100 py-3 rounded-xl font-bold text-slate-700 active:bg-slate-200 border">🔊 Listen</button>
                <button id="micBtn" onclick="toggleSpeech()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:bg-blue-700 transition-all">
                    🎤 START SPEAKING
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden bg-slate-900 rounded-3xl p-6 text-white shadow-2xl animate-bounce">
            <div class="flex justify-between items-center mb-4">
                <div id="scoreDisplay" class="text-5xl font-black text-blue-400">0%</div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Heard</p>
                    <p id="heardText" class="italic text-slate-300 text-sm">...</p>
                </div>
            </div>
            <button onclick="nextStep()" class="w-full bg-white text-slate-900 py-3 rounded-xl font-bold">Next Sentence ➔</button>
        </div>
        
        <p class="text-center text-[10px] text-slate-400 uppercase tracking-widest font-bold">Requires HTTPS or Localhost to work</p>
    </div>

    <script>
        const sentences = [
            "I really appreciate your help with this project.",
            "The quick brown fox jumps over the lazy dog.",
            "Consistency is more important than perfection.",
            "I am learning to speak English with an American accent."
        ];
        let idx = 0;
        let isActive = false;
        let recognition;

        // Initialize Speech Engine
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            recognition = new Speech();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onresult = (event) => {
                const result = event.results[0][0].transcript;
                showScore(result);
            };

            recognition.onerror = (e) => {
                console.error(e);
                alert("Speech Error: " + e.error + ". Make sure your microphone is enabled.");
                resetBtn();
            };

            recognition.onend = () => { resetBtn(); };
        }

        function toggleSpeech() {
            if (!Speech) return alert("Your browser does not support Speech Recognition. Please use Chrome or Safari.");
            
            if (!isActive) {
                try {
                    recognition.start();
                    isActive = true;
                    document.getElementById('micBtn').innerText = "🛑 LISTENING...";
                    document.getElementById('micBtn').classList.replace('bg-blue-600', 'bg-red-500');
                    document.getElementById('resultArea').classList.add('hidden');
                } catch (e) { console.error(e); }
            } else {
                recognition.stop();
                resetBtn();
            }
        }

        function resetBtn() {
            isActive = false;
            document.getElementById('micBtn').innerText = "🎤 START SPEAKING";
            document.getElementById('micBtn').classList.replace('bg-red-500', 'bg-blue-600');
        }

        function playModel() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(sentences[idx]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function showScore(heard) {
            const target = sentences[idx].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = heard.toLowerCase().replace(/[^\w\s]/gi, '');
            const targetWords = target.split(/\s+/);
            const matches = targetWords.filter(w => input.includes(w)).length;
            const score = Math.round((matches / targetWords.length) * 100);

            document.getElementById('heardText').innerText = `"${heard}"`;
            document.getElementById('scoreDisplay').innerText = score + "%";
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function nextStep() {
            idx = (idx + 1) % sentences.length;
            document.getElementById('targetText').innerText = `"${sentences[idx]}"`;
            document.getElementById('resultArea').classList.add('hidden');
        }
    </script>
</body>
</html>
