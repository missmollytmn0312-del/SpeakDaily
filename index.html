<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Pro | Intelligent Scoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 pb-20 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <h1 class="font-bold text-slate-800 text-lg">Speaking Pro</h1>
            <div class="bg-orange-500 text-white px-4 py-1 rounded-full text-sm font-bold">
                🔥 <span id="streakCount">0</span> Day Streak
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 text-center">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 flex items-center justify-center min-h-[120px]">
                <p id="targetText" class="text-lg font-semibold text-indigo-900 leading-relaxed italic">"Press Next to start"</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="playAI()" class="bg-slate-100 hover:bg-slate-200 py-4 rounded-2xl font-bold text-slate-700 transition">🔊 Listen</button>
                <button id="micBtn" onclick="toggleRecording()" class="bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg transition-all">🎤 Record</button>
            </div>

            <button onclick="nextSentence()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-900 mb-6 transition">Next Sentence ➔</button>

            <div id="resultArea" class="hidden mt-4 pt-6 border-t border-slate-100 animate-in fade-in zoom-in duration-300">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pronunciation Accuracy</p>
                <div id="scoreText" class="text-5xl font-black text-blue-600 mb-4 tracking-tighter">0%</div>
                
                <div class="w-full bg-slate-200 rounded-full h-3 mb-4 overflow-hidden">
                    <div id="scoreBar" class="h-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                </div>
                
                <div class="bg-slate-50 p-3 rounded-lg border border-dashed border-slate-200">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">We Heard:</p>
                    <p id="userTranscript" class="text-sm text-slate-600 italic"></p>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">📁 My Recordings</h3>
            <div id="gallery" class="space-y-4 max-h-60 overflow-y-auto italic text-xs text-slate-400 text-center">
                Practice a sentence to see your history!
            </div>
        </div>
    </div>

    <script>
        const dailySentences = [
            "I'm looking forward to our meeting later this afternoon.",
            "Could you please repeat that? I didn't quite catch what you said.",
            "Consistency is more important than perfection.",
            "The journey of a thousand miles begins with a single step.",
            "I really appreciate your help with this project.",
            "To be honest, I think we should try a different approach."
        ];

        let currentIndex = 0;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        // --- Persistent Streak Logic ---
        function loadStreak() {
            const streak = localStorage.getItem('dailyStreak') || 0;
            const lastDate = localStorage.getItem('lastDate');
            const today = new Date().toDateString();
            
            if (lastDate && (new Date(today) - new Date(lastDate)) / 86400000 > 1) {
                localStorage.setItem('dailyStreak', 0);
                document.getElementById('streakCount').innerText = "0";
            } else {
                document.getElementById('streakCount').innerText = streak;
            }
        }

        function updateStreak() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('lastDate');
            let currentStreak = parseInt(localStorage.getItem('dailyStreak') || 0);

            if (lastDate !== today) {
                currentStreak++;
                localStorage.setItem('dailyStreak', currentStreak);
                localStorage.setItem('lastDate', today);
                document.getElementById('streakCount').innerText = currentStreak;
            }
        }

        // --- Audio & Recognition ---
        function playAI() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(dailySentences[currentIndex]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        async function toggleRecording() {
            const btn = document.getElementById('micBtn');
            if (!isRecording) {
                audioChunks = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        addVoiceToGallery(audioUrl, dailySentences[currentIndex]);
                        stream.getTracks().forEach(t => t.stop());
                    };

                    startSpeechEngine();
                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = "🛑 Stop";
                    btn.classList.replace('bg-blue-600', 'bg-red-500');
                } catch (err) { alert("Microphone access is required."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🎤 Record";
                btn.classList.replace('bg-red-500', 'bg-blue-600');
            }
        }

        function startSpeechEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRec();
            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                calculateIntelligentScore(speech);
                updateStreak();
            };
            rec.start();
        }

        // --- THE SCORING FUNCTION ---
        function calculateIntelligentScore(userSpeech) {
            const target = dailySentences[currentIndex].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = userSpeech.toLowerCase().replace(/[^\w\s]/gi, '');
            
            const targetWords = target.split(/\s+/);
            const inputWords = input.split(/\s+/);
            
            let matchCount = 0;
            targetWords.forEach(word => {
                if (inputWords.includes(word)) {
                    matchCount++;
                }
            });

            const score = Math.round((matchCount / targetWords.length) * 100);
            displayScore(score, userSpeech);
        }

        function displayScore(score, transcript) {
            const area = document.getElementById('resultArea');
            const scoreText = document.getElementById('scoreText');
            const bar = document.getElementById('scoreBar');
            
            area.classList.remove('hidden');
            scoreText.innerText = score + "%";
            bar.style.width = score + "%";
            
            // Color Logic
            if (score >= 80) {
                bar.className = "h-full transition-all duration-1000 bg-emerald-500";
                scoreText.className = "text-5xl font-black text-emerald-600 mb-4 tracking-tighter";
            } else if (score >= 50) {
                bar.className = "h-full transition-all duration-1000 bg-amber-400";
                scoreText.className = "text-5xl font-black text-amber-500 mb-4 tracking-tighter";
            } else {
                bar.className = "h-full transition-all duration-1000 bg-rose-500";
                scoreText.className = "text-5xl font-black text-rose-600 mb-4 tracking-tighter";
            }

            document.getElementById('userTranscript').innerText = `"${transcript}"`;
        }

        function addVoiceToGallery(url, title) {
            const gallery = document.getElementById('gallery');
            if (gallery.innerText.includes("Practice a sentence")) gallery.innerHTML = "";
            const div = document.createElement('div');
            div.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 text-left";
            div.innerHTML = `
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-2">${title}</p>
                <audio src="${url}" controls class="w-full h-8"></audio>
            `;
            gallery.prepend(div);
        }

        function nextSentence() {
            currentIndex = (currentIndex + 1) % dailySentences.length;
            document.getElementById('targetText').innerText = `"${dailySentences[currentIndex]}"`;
            document.getElementById('resultArea').classList.add('hidden');
        }

        // Run on load
        loadStreak();
        nextSentence();
    </script>
</body>
</html>
