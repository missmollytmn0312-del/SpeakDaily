<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Speaker | Final Stability</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <h1 class="font-bold text-slate-800">Hero Speaker</h1>
            <div class="bg-orange-500 text-white px-4 py-1 rounded-full text-sm font-bold shadow-sm">🔥 <span id="streakCount">0</span></div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div id="stepIndicator" class="text-[10px] font-bold text-blue-500 uppercase mb-4 tracking-widest text-center">Step 1: Listen</div>
            
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 min-h-[100px] flex items-center justify-center border border-indigo-100">
                <p id="targetText" class="text-lg font-bold text-indigo-900 text-center leading-tight">"I'm looking forward to our meeting later this afternoon."</p>
            </div>

            <div id="liveFeedback" class="hidden mb-4 p-3 bg-slate-900 rounded-xl border-l-4 border-blue-500">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">Live Detection:</p>
                <p id="interimText" class="text-sm text-white italic font-medium">Listening for your voice...</p>
            </div>

            <div id="actionArea" class="space-y-3">
                <button id="listenBtn" onclick="playAI()" class="w-full bg-slate-100 py-4 rounded-2xl font-bold text-slate-700 active:bg-slate-200">🔊 Listen to AI</button>
                <button id="micBtn" onclick="startRecording()" class="hidden w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:bg-blue-700">🎤 Start Recording</button>
                <button id="stopBtn" onclick="stopRecording()" class="hidden w-full bg-red-500 text-white py-4 rounded-2xl font-bold animate-pulse">🛑 Stop & See Score</button>
            </div>

            <div id="resultArea" class="hidden mt-6 pt-6 border-t-2 border-slate-50">
                <div id="scoreText" class="text-7xl font-black text-blue-600 text-center mb-4">0%</div>
                <button onclick="nextSentence()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Next Sentence ➔</button>
            </div>
        </div>

        <div id="gallery" class="space-y-3"></div>
    </div>

    <script>
        const dailySentences = [
            "I'm looking forward to our meeting later this afternoon.",
            "Could you please repeat that? I didn't quite catch what you said.",
            "Consistency is more important than perfection.",
            "The journey of a thousand miles begins with a single step.",
            "I really appreciate your help with this project."
        ];

        let currentIndex = 0;
        let mediaRecorder;
        let audioChunks = [];
        let recognition;
        let capturedText = "";

        // --- Initialize Speech Engine with Mobile-Specific Tweaks ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (e) => {
                let live = "";
                for (let i = 0; i < e.results.length; i++) {
                    live += e.results[i][0].transcript;
                }
                capturedText = live;
                document.getElementById('interimText').innerText = live;
            };
        }

        function playAI() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(dailySentences[currentIndex]);
            msg.onend = () => {
                document.getElementById('listenBtn').classList.add('hidden');
                document.getElementById('micBtn').classList.remove('hidden');
                document.getElementById('stepIndicator').innerText = "Step 2: Record";
            };
            window.speechSynthesis.speak(msg);
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
                audioChunks = [];
                capturedText = "";
                
                document.getElementById('interimText').innerText = "Listening...";
                document.getElementById('liveFeedback').classList.remove('hidden');

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mime });
                    addGallery(URL.createObjectURL(blob));
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                recognition.start();

                document.getElementById('micBtn').classList.add('hidden');
                document.getElementById('stopBtn').classList.remove('hidden');
            } catch (err) { alert("Mic permission denied!"); }
        }

        function stopRecording() {
            if(mediaRecorder) mediaRecorder.stop();
            if(recognition) recognition.stop();
            
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('stepIndicator').innerText = "Result";
            
            // Calculate Score Immediately
            const target = dailySentences[currentIndex].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = capturedText.toLowerCase().replace(/[^\w\s]/gi, '');
            const tWords = target.split(/\s+/);
            const iWords = input.split(/\s+/);
            const matches = tWords.filter(w => iWords.includes(w)).length;
            const score = Math.round((matches / tWords.length) * 100);

            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('scoreText').innerText = score + "%";
            
            if (score > 30) updateStreak();
        }

        function addGallery(url) {
            const gallery = document.getElementById('gallery');
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-2xl shadow-sm border flex flex-col gap-2";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[9px] font-bold text-slate-400">YOUR VOICE</span>
                    <a href="${url}" download="practice.wav" class="text-[10px] bg-blue-600 text-white px-3 py-1 rounded-full font-bold">📥 DOWNLOAD</a>
                </div>
                <audio src="${url}" controls class="w-full h-8"></audio>`;
            gallery.prepend(div);
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (localStorage.getItem('lastDate') !== today) {
                let s = (parseInt(localStorage.getItem('dailyStreak') || 0)) + 1;
                localStorage.setItem('dailyStreak', s);
                localStorage.setItem('lastDate', today);
                document.getElementById('streakCount').innerText = s;
            }
        }

        function nextSentence() {
            currentIndex = (currentIndex + 1) % dailySentences.length;
            document.getElementById('targetText').innerText = dailySentences[currentIndex];
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('liveFeedback').classList.add('hidden');
            document.getElementById('listenBtn').classList.remove('hidden');
            document.getElementById('stepIndicator').innerText = "Step 1: Listen";
        }

        document.getElementById('streakCount').innerText = localStorage.getItem('dailyStreak') || 0;
    </script>
</body>
</html>
