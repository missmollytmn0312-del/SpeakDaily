<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Voice Conversation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #22c55e;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warn: #f59e0b;
      --border: #1f2937;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    .app {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .streak {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .streak .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .sentence {
      font-size: 1.05rem;
      line-height: 1.5;
      padding: 12px;
      border-radius: 12px;
      background: #0b1222;
      border: 1px solid #0d1a32;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .controls {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1222;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    button.primary { background: var(--accent); color: white; }
    button.warn { background: var(--warn); color: #1f2937; }
    button.danger { background: var(--danger); color: white; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .score .value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .progress {
      height: 10px;
      background: #0b1222;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
      transition: width 0.3s;
    }

    .heard {
      padding: 10px;
      border-radius: 10px;
      background: #0b1222;
      min-height: 52px;
    }

    .matched { color: #22c55e; font-weight: bold; }
    .missed { color: #ef4444; }

    audio { width: 100%; margin-top: 8px; }
    .small { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">Daily Voice Conversation</div>
      <div class="streak">
        <div class="dot"></div>
        <div>
          <div><strong>Streak:</strong> <span id="streakDays">0</span> days</div>
        </div>
      </div>
    </header>

    <div class="card">
      <div class="label">Today’s conversation text</div>
      <div id="sentenceDisplay" class="sentence">Loading…</div>
      <div class="controls" style="margin-top:10px;">
        <button id="btnSpeak" class="primary">Speak</button>
        <button id="btnNext" class="warn">Next</button>
        <button id="btnRecord">Record</button>
        <button id="btnStop" class="danger" disabled>Stop</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Your accuracy score</div>
      <div class="score">
        <div class="value" id="scoreValue">0%</div>
      </div>
      <div class="progress" style="margin-top:8px;">
        <div id="scoreBar" class="progress-bar"></div>
      </div>
      <div id="heardText" class="heard" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="label">Your voice recording</div>
      <audio id="audioPlayer" controls></audio>
      <div class="controls" style="margin-top:10px;">
        <button id="btnDownload">Download</button>
        <button id="btnClearAudio">Clear</button>
      </div>
    </div>
  </div>

  <script>
    const dailySentences = [
      "Good morning! How are you feeling today?",
      "I would like a cup of coffee, please.",
      "Can you help me find the nearest bus stop?",
      "The weather in Hanoi is warm and breezy.",
      "Let’s practice English for fifteen minutes.",
      "What time does the meeting start tomorrow?",
      "I’m learning Vietnamese and enjoying it."
    ];

    let currentIndex = 0;
    let mediaRecorder;
    let audioChunks = [];
    let recognition;
    let lastBlobUrl = null;

    // Elements
    const sentenceDisplay = document.getElementById('sentenceDisplay');
    const streakDays = document.getElementById('streakDays');
    const scoreValue = document.getElementById('scoreValue');
    const scoreBar = document.getElementById('scoreBar');
    const heardText = document.getElementById('heardText');
    const audioPlayer = document.getElementById('audioPlayer');
    const btnRecord = document.getElementById('btnRecord');
    const btnStop = document.getElementById('btnStop');

    // Speech Recognition Setup
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.onresult = (e) => {
        const transcript = Array.from(e.results)
          .map(result => result[0].transcript)
          .join('');
        processScore(transcript);
      };
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mimeType });
          if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
          lastBlobUrl = URL.createObjectURL(blob);
          audioPlayer.src = lastBlobUrl;
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        if (recognition) {
          heardText.innerHTML = "Listening...";
          recognition.start();
        }
        
        btnRecord.disabled = true;
        btnStop.disabled = false;
      } catch (err) {
        alert("Mic access denied or not supported.");
      }
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      if (recognition) recognition.stop();
      btnRecord.disabled = false;
      btnStop.disabled = true;
    }

    function processScore(speech) {
      const target = dailySentences[currentIndex].toLowerCase().replace(/[^\w\s]/gi, '');
      const input = speech.toLowerCase().replace(/[^\w\s]/gi, '');
      
      const tWords = target.split(/\s+/);
      const iWords = input.split(/\s+/);
      
      let html = "";
      let matches = 0;

      tWords.forEach(word => {
        if (iWords.includes(word)) {
          html += `<span class="matched">${word}</span> `;
          matches++;
        } else {
          html += `<span class="missed">${word}</span> `;
        }
      });

      const score = Math.round((matches / tWords.length) * 100);
      scoreValue.innerText = score + "%";
      scoreBar.style.width = score + "%";
      heardText.innerHTML = `<strong>Heard:</strong> ${speech}<br><br>${html}`;
      
      if (score > 50) updateStreak();
    }

    function updateStreak() {
      const today = new Date().toDateString();
      const lastDate = localStorage.getItem('lastDate');
      let s = parseInt(localStorage.getItem('dailyStreak') || 0);
      
      if (lastDate !== today) {
        s++;
        localStorage.setItem('dailyStreak', s);
        localStorage.setItem('lastDate', today);
        streakDays.innerText = s;
      }
    }

    function loadSentence() {
      sentenceDisplay.innerText = dailySentences[currentIndex];
      scoreValue.innerText = "0%";
      scoreBar.style.width = "0%";
      heardText.innerHTML = "";
    }

    // Event Listeners
    document.getElementById('btnSpeak').onclick = () => {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(dailySentences[currentIndex]);
      window.speechSynthesis.speak(msg);
    };
