<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Pro | Pro Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans flex flex-col items-center">
    <div class="w-full max-w-md space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <h1 class="font-bold text-slate-800">Speaking Hero</h1>
            <div class="bg-orange-500 text-white px-3 py-1 rounded-full text-xs font-bold">🔥 <span id="streakCount">0</span></div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 text-lg font-bold text-indigo-900 text-center leading-tight">
                <p id="targetText">"The journey of a thousand miles begins with a single step."</p>
            </div>

            <div id="statusBox" class="text-center mb-4">
                <span id="statusLabel" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Ready to practice</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="playAI()" class="bg-slate-100 py-4 rounded-2xl font-bold text-slate-700 active:bg-slate-200">🔊 Listen</button>
                <button id="micBtn" onclick="toggleRec()" class="bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">🎤 Record</button>
            </div>
        </div>

        <div id="resultArea" class="hidden bg-white p-6 rounded-3xl shadow-lg border border-slate-200 text-center animate-in fade-in">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Accuracy Score</p>
            <div id="scoreText" class="text-7xl font-black text-blue-600 mb-4">0%</div>
            
            <div class="bg-slate-900 p-4 rounded-2xl text-left mb-4">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Phone Heard:</p>
                <p id="userTranscript" class="text-sm text-white italic font-medium tracking-wide">...</p>
            </div>

            <button onclick="nextStep()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold">Next Sentence ➔</button>
        </div>

        <div id="gallery" class="space-y-3"></div>
    </div>

    <script>
        const sentences = [
            "The journey of a thousand miles begins with a single step.",
            "I'm looking forward to our meeting later this afternoon.",
            "Consistency is more important than perfection.",
            "Could you please repeat that? I didn't quite catch what you said.",
            "I really appreciate your help with this project."
        ];
        let idx = 0;
        let isRec = false;
        let recorder;
        let chunks = [];
        let recognition;

        // Fixes the "Listen Once" mobile bug
        function playAI() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(sentences[idx]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        async function toggleRec() {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('statusLabel');

            if (!isRec) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                    recorder = new MediaRecorder(stream);
                    chunks = [];
                    
                    // Setup Speech Recognition
                    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
                    recognition = new Speech();
                    recognition.lang = 'en-US';
                    recognition.interimResults = false;

                    recognition.onresult = (e) => {
                        const heard = e.results[0][0].transcript;
                        processScore(heard);
                    };

                    recognition.onstart = () => {
                        status.innerText = "● Recording Voice...";
                        status.className = "text-[10px] font-bold text-red-500 uppercase tracking-widest";
                    };

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mime });
                        addToGallery(URL.createObjectURL(blob));
                        stream.getTracks().forEach(t => t.stop());
                    };

                    recorder.start();
                    recognition.start();
                    isRec = true;
                    btn.innerText = "🛑 Stop";
                    btn.className = "bg-red-500 text-white py-4 rounded-2xl font-bold shadow-lg w-full col-span-2";
                } catch (e) { alert("Mic Access Denied"); }
            } else {
                recorder.stop();
                recognition.stop();
                isRec = false;
                btn.innerText = "🎤 Record";
                btn.className = "bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg";
                status.innerText = "Processing...";
                status.className = "text-[10px] font-bold text-blue-500 uppercase tracking-widest";
            }
        }

        function processScore(text) {
            const target = sentences[idx].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = text.toLowerCase().replace(/[^\w\s]/gi, '');
            const tWords = target.split(/\s+/);
            const iWords = input.split(/\s+/);
            const matches = tWords.filter(w => iWords.includes(w)).length;
            const score = Math.round((matches / tWords.length) * 100);

            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('scoreText').innerText = score + "%";
            document.getElementById('userTranscript').innerText = `"${text}"`;
            document.getElementById('statusLabel').innerText = "Done!";
            
            if (score > 30) updateStreak();
        }

        function addToGallery(url) {
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-2xl shadow-sm border flex flex-col gap-2 w-full";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Voice File</span>
                    <a href="${url}" download="practice.wav" class="text-[10px] bg-green-500 text-white px-3 py-1 rounded-full font-bold">📥 SAVE</a>
                </div>
                <audio src="${url}" controls class="w-full h-8"></audio>`;
            document.getElementById('gallery').prepend(div);
        }

        function nextStep() {
            idx = (idx + 1) % sentences.length;
            document.getElementById('targetText').innerText = sentences[idx];
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('statusLabel').innerText = "Ready to practice";
            document.getElementById('statusLabel').className = "text-[10px] font-bold text-slate-400 uppercase tracking-widest";
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (localStorage.getItem('lastDate') !== today) {
                let s = (parseInt(localStorage.getItem('dailyStreak') || 0)) + 1;
                localStorage.setItem('dailyStreak', s);
                localStorage.setItem('lastDate', today);
                document.getElementById('streakCount').innerText = s;
            }
        }
        document.getElementById('streakCount').innerText = localStorage.getItem('dailyStreak') || 0;
    </script>
</body>
</html>
