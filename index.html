<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Speaker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .record-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans select-none">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <div>
                <h1 class="font-black text-slate-800 text-xl tracking-tight">HERO SPEAKER</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Master American English</p>
            </div>
            <div class="bg-orange-100 text-orange-600 px-4 py-2 rounded-2xl flex items-center gap-2 border border-orange-200">
                <span class="text-xl">🔥</span>
                <span id="streakDisplay" class="font-bold text-lg">0</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 relative overflow-hidden">
            <div id="targetText" class="text-xl font-bold text-slate-800 text-center leading-relaxed mb-6">
                "The quick brown fox jumps over the lazy dog."
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="playModel()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition-all">🔊 Listen to Model</button>
                
                <button id="mainBtn" onclick="handleMicClick()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-3">
                    <span id="micIcon">🎤</span> <span id="btnText">START RECORDING</span>
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Accuracy Score</p>
                        <h2 id="scorePercent" class="text-6xl font-black text-blue-400">0%</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Heard Part</p>
                        <p id="heardText" class="italic text-slate-300 text-sm mt-1">...</p>
                    </div>
                </div>
                
                <div id="audioControls" class="bg-white/10 p-3 rounded-2xl flex items-center gap-3">
                    <audio id="player" controls class="h-8 flex-grow"></audio>
                    <a id="downloadBtn" class="bg-blue-500 p-2 rounded-lg text-white font-bold text-xs">📥</a>
                </div>
            </div>

            <button onclick="nextSentence()" class="w-full bg-white border-2 border-slate-200 py-4 rounded-2xl font-bold text-slate-600 hover:bg-slate-50">
                Next Sentence ➔
            </button>
        </div>
    </div>

    <script>
        const sentences = [
            "I'm looking forward to our meeting later this afternoon.",
            "The journey of a thousand miles begins with a single step.",
            "Consistency is more important than perfection.",
            "Could you please repeat that? I didn't quite catch it.",
            "The quick brown fox jumps over the lazy dog."
        ];
        
        let idx = 0;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        let stream;

        // 1. Streak Logic
        function updateStreak() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('hero_last_date');
            let streak = parseInt(localStorage.getItem('hero_streak') || 0);

            if (lastDate !== today) {
                if (lastDate === new Date(Date.now() - 86400000).toDateString()) {
                    streak++;
                } else {
                    streak = 1;
                }
                localStorage.setItem('hero_streak', streak);
                localStorage.setItem('hero_last_date', today);
            }
            document.getElementById('streakDisplay').innerText = streak;
        }
        document.getElementById('streakDisplay').innerText = localStorage.getItem('hero_streak') || 0;

        // Play Model Voice
        function playModel() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(sentences[idx]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        // 2. Dual-Mode Record Logic
        async function handleMicClick() {
            const btn = document.getElementById('mainBtn');
            const txt = document.getElementById('btnText');
            
            if (!isRecording) {
                // START
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        document.getElementById('player').src = url;
                        document.getElementById('downloadBtn').href = url;
                        document.getElementById('downloadBtn').download = `practice_${Date.now()}.wav`;
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('record-active');
                    txt.innerText = "STOP RECORDING";
                    document.getElementById('resultArea').classList.add('hidden');
                } catch (err) { alert("Please allow microphone access."); }
            } else {
                // STOP
                mediaRecorder.stop();
                stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                btn.classList.remove('record-active');
                txt.innerText = "START RECORDING";
                
                // 4. Extract Text & 3. Score
                runAnalysis();
            }
        }

        function runAnalysis() {
            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            const rec = new Speech();
            rec.lang = 'en-US';

            rec.onresult = (e) => {
                const heard = e.results[0][0].transcript;
                calculateScore(heard);
            };

            rec.onerror = () => {
                document.getElementById('heardText').innerText = "Could not detect speech. Try again!";
                document.getElementById('scorePercent').innerText = "0%";
                document.getElementById('resultArea').classList.remove('hidden');
            };

            rec.start();
        }

        function calculateScore(heard) {
            const target = sentences[idx].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = heard.toLowerCase().replace(/[^\w\s]/gi, '');
            
            const targetWords = target.split(' ');
            const inputWords = input.split(' ');
            
            const matches = targetWords.filter(word => inputWords.includes(word)).length;
            const score = Math.round((matches / targetWords.length) * 100);

            document.getElementById('heardText').innerText = `"${heard}"`;
            document.getElementById('scorePercent').innerText = score + "%";
            document.getElementById('resultArea').classList.remove('hidden');
            
            if (score > 40) updateStreak();
        }

        function nextSentence() {
            idx = (idx + 1) % sentences.length;
            document.getElementById('targetText').innerText = `"${sentences[idx]}"`;
            document.getElementById('resultArea').classList.add('hidden');
        }
    </script>
</body>
</html>
