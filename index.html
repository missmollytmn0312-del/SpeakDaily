<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Speaker | Pro Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .record-active { animation: pulse 1.2s infinite; background-color: #ef4444 !important; border-color: #fca5a5 !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans select-none">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <h1 class="font-black text-slate-800 tracking-tight">HERO SPEAKER</h1>
            <div class="bg-orange-500 text-white px-3 py-1 rounded-xl font-bold flex items-center gap-2">
                <span>🔥</span> <span id="streakDisplay">0</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 min-h-[100px] flex items-center justify-center border border-indigo-100">
                <p id="targetDisplay" class="text-xl font-bold text-indigo-900 text-center italic"></p>
            </div>

            <div class="space-y-3">
                <button onclick="playModel()" class="w-full bg-slate-100 py-3 rounded-xl font-bold text-slate-700 active:bg-slate-200 border">🔊 Listen</button>
                
                <div class="grid grid-cols-1 gap-3">
                    <button id="recordBtn" onclick="startRecording()" class="bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">🎤 1. Start Recording</button>
                    <button id="stopBtn" onclick="stopRecording()" class="hidden bg-red-500 text-white py-4 rounded-2xl font-black shadow-lg">🛑 2. Stop & Save</button>
                    <button id="scoreBtn" onclick="runScoring()" class="hidden bg-emerald-500 text-white py-4 rounded-2xl font-black shadow-lg animate-bounce">✨ 3. Get Score</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden bg-slate-900 rounded-3xl p-6 text-white shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <div class="text-5xl font-black text-blue-400" id="scorePercent">0%</div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Heard</p>
                    <p id="heardText" class="italic text-slate-300 text-sm">...</p>
                </div>
            </div>
            
            <div class="bg-white/5 p-3 rounded-2xl">
                <div class="flex justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">My Voice File</span>
                    <a id="downloadBtn" class="text-[10px] text-blue-400 font-bold underline">DOWNLOAD FILE</a>
                </div>
                <audio id="player" controls class="w-full h-8"></audio>
            </div>

            <button onclick="nextSentence()" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-bold">Next Sentence ➔</button>
        </div>
    </div>

    <script>
        const conversation = [
            "The quick brown fox jumps over the lazy dog.",
            "I'm looking forward to our meeting later this afternoon.",
            "Consistency is more important than perfection.",
            "I really appreciate your help with this project."
        ];

        let currentIdx = 0;
        let mediaRec;
        let chunks = [];
        let stream;

        function updateUI() {
            document.getElementById('targetDisplay').innerText = `"${conversation[currentIdx]}"`;
            document.getElementById('streakDisplay').innerText = localStorage.getItem('hero_streak') || 0;
        }

        function playModel() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(conversation[currentIdx]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        async function startRecording() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRec = new MediaRecorder(stream, { mimeType: mime });
                chunks = [];

                mediaRec.ondataavailable = e => chunks.push(e.data);
                mediaRec.onstop = () => {
                    const blob = new Blob(chunks, { type: mime });
                    const url = URL.createObjectURL(blob);
                    document.getElementById('player').src = url;
                    document.getElementById('downloadBtn').href = url;
                    document.getElementById('downloadBtn').download = "my_voice.wav";
                    
                    document.getElementById('scoreBtn').classList.remove('hidden');
                };

                mediaRec.start();
                document.getElementById('recordBtn').classList.add('hidden');
                document.getElementById('stopBtn').classList.remove('hidden');
                document.getElementById('resultArea').classList.add('hidden');
            } catch (e) { alert("Mic blocked. Please check site settings."); }
        }

        function stopRecording() {
            mediaRec.stop();
            stream.getTracks().forEach(t => t.stop()); // FULL RESET OF MIC
            document.getElementById('stopBtn').classList.add('hidden');
        }

        function runScoring() {
            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!Speech) return alert("Browser not supported");

            const rec = new Speech();
            rec.lang = 'en-US';
            
            rec.onstart = () => {
                document.getElementById('scoreBtn').innerText = "Processing...";
            };

            rec.onresult = (e) => {
                const heard = e.results[0][0].transcript;
                const target = conversation[currentIdx].toLowerCase().replace(/[^\w\s]/gi, '');
                const input = heard.toLowerCase().replace(/[^\w\s]/gi, '');
                
                const matches = target.split(/\s+/).filter(w => input.split(/\s+/).includes(w)).length;
                const score = Math.round((matches / target.split(/\s+/).length) * 100);

                document.getElementById('heardText').innerText = `"${heard}"`;
                document.getElementById('scorePercent').innerText = score + "%";
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('scoreBtn').classList.add('hidden');
                document.getElementById('scoreBtn').innerText = "✨ 3. Get Score";
                
                if (score > 30) updateStreak();
            };

            rec.onerror = () => {
                alert("Speech recognition failed. Please try again.");
                document.getElementById('recordBtn').classList.remove('hidden');
                document.getElementById('scoreBtn').classList.add('hidden');
            };

            rec.start();
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (localStorage.getItem('hero_date') !== today) {
                let s = parseInt(localStorage.getItem('hero_streak') || 0) + 1;
                localStorage.setItem('hero_streak', s);
                localStorage.setItem('hero_date', today);
                updateUI();
            }
        }

        function nextSentence() {
            currentIdx = (currentIdx + 1) % conversation.length;
            updateUI();
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('recordBtn').classList.remove('hidden');
        }

        updateUI();
    </script>
</body>
</html>
