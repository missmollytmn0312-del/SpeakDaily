<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Pro | Mobile Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans overflow-x-hidden">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <h1 class="font-bold text-slate-800">Speaking Pro</h1>
            <div class="bg-orange-500 text-white px-4 py-1 rounded-full text-sm font-bold">🔥 Streak: <span id="streakCount">0</span></div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 text-center">
            <div id="statusLabel" class="text-[10px] font-bold text-blue-500 uppercase mb-2 tracking-widest">Ready to practice</div>
            
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 min-h-[100px] flex items-center justify-center">
                <p id="targetText" class="text-lg font-semibold text-indigo-900 italic leading-relaxed">"Tap Record & Speak"</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="playAI()" class="bg-slate-100 py-4 rounded-2xl font-bold text-slate-700 active:bg-slate-200">🔊 Listen</button>
                <button id="micBtn" onclick="toggleMobileMic()" class="bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:bg-blue-700 transition-all">🎤 Record</button>
            </div>

            <button onclick="nextSentence()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Next Sentence ➔</button>

            <div id="resultArea" class="hidden mt-6 pt-6 border-t border-slate-100 scale-in">
                <div id="scoreText" class="text-6xl font-black text-blue-600 mb-2">0%</div>
                <p id="userTranscript" class="text-xs text-slate-500 italic mb-4 px-4"></p>
                <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                    <div id="scoreBar" class="h-full bg-blue-600 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4 text-sm">📁 History & Downloads</h3>
            <div id="gallery" class="space-y-4">
                <p class="text-slate-400 text-xs italic text-center">Recordings will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        const dailySentences = [
            "I'm looking forward to our meeting later this afternoon.",
            "Could you please repeat that? I didn't quite catch what you said.",
            "Consistency is more important than perfection.",
            "The journey of a thousand miles begins with a single step.",
            "I really appreciate your help with this project."
        ];

        let currentIndex = 0;
        let isActive = false;
        let recognition;

        // --- MOBILE OPTIMIZED SPEECH ENGINE ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false; // Required for mobile stability

            recognition.onstart = () => {
                document.getElementById('statusLabel').innerText = "● LISTENING NOW...";
                document.getElementById('statusLabel').classList.replace('text-blue-500', 'text-red-500');
            };

            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                processMobileScore(speech);
            };

            recognition.onerror = (e) => {
                document.getElementById('statusLabel').innerText = "ERROR: " + e.error;
                stopEverything();
            };

            recognition.onend = () => {
                if(isActive) stopEverything();
            };
        }

        function toggleMobileMic() {
            if (!isActive) {
                isActive = true;
                document.getElementById('micBtn').innerText = "🛑 STOP";
                document.getElementById('micBtn').classList.replace('bg-blue-600', 'bg-red-500');
                try {
                    recognition.start();
                } catch(e) { console.log(e); }
            } else {
                stopEverything();
            }
        }

        function stopEverything() {
            isActive = false;
            recognition.stop();
            document.getElementById('micBtn').innerText = "🎤 RECORD";
            document.getElementById('micBtn').classList.replace('bg-red-500', 'bg-blue-600');
            document.getElementById('statusLabel').innerText = "PROCESSING...";
            document.getElementById('statusLabel').classList.replace('text-red-500', 'text-blue-500');
        }

        function processMobileScore(speech) {
            const target = dailySentences[currentIndex].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = speech.toLowerCase().replace(/[^\w\s]/gi, '');
            const tWords = target.split(' ');
            const iWords = input.split(' ');
            
            const matches = tWords.filter(w => iWords.includes(w)).length;
            const score = Math.round((matches / tWords.length) * 100);

            // Display Results
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('scoreText').innerText = score + "%";
            document.getElementById('scoreBar').style.width = score + "%";
            document.getElementById('userTranscript').innerText = `Heard: "${speech}"`;
            document.getElementById('statusLabel').innerText = "DONE!";
            
            if (score > 30) updateStreak();
            
            // Generate a 'Fake' Audio for Download (Mobile Speech API doesn't allow raw saving easily)
            addToGallery(speech, dailySentences[currentIndex]);
        }

        function addToGallery(text, title) {
            const gallery = document.getElementById('gallery');
            if (gallery.innerHTML.includes("Recordings will appear")) gallery.innerHTML = "";
            
            const div = document.createElement('div');
            div.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col gap-2 animate-pulse";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest truncate w-40">${title}</p>
                    <button onclick="downloadText('${text}')" class="text-[9px] bg-green-100 text-green-600 px-2 py-1 rounded font-bold">📥 SAVE TRANSCRIPT</button>
                </div>
                <p class="text-xs text-slate-600 italic">" ${text} "</p>
            `;
            gallery.prepend(div);
            setTimeout(() => div.classList.remove('animate-pulse'), 1000);
        }

        function downloadText(text) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "practice-transcript.txt";
            a.click();
        }

        function playAI() {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(dailySentences[currentIndex]);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        function nextSentence() {
            currentIndex = (currentIndex + 1) % dailySentences.length;
            document.getElementById('targetText').innerText = `"${dailySentences[currentIndex]}"`;
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('statusLabel').innerText = "READY";
        }

        function updateStreak() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('lastDate');
            let s = parseInt(localStorage.getItem('dailyStreak') || 0);
            if (lastDate !== today) {
                s++;
                localStorage.setItem('dailyStreak', s);
                localStorage.setItem('lastDate', today);
                document.getElementById('streakCount').innerText = s;
            }
        }

        document.getElementById('streakCount').innerText = localStorage.getItem('dailyStreak') || 0;
        nextSentence();
    </script>
</body>
</html>
