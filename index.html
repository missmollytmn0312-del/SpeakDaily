<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Speaker | Sync-Locked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .record-active { animation: pulse 1.2s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.97); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans select-none">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-200">
            <div>
                <h1 class="font-black text-slate-800 text-xl">HERO SPEAKER</h1>
                <p id="lessonInfo" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Sentence 1 of 5</p>
            </div>
            <div class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold flex items-center gap-2">
                <span>🔥</span> <span id="streakDisplay">0</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 min-h-[120px] flex items-center justify-center border border-indigo-100">
                <p id="targetDisplay" class="text-xl font-bold text-indigo-900 text-center leading-snug italic"></p>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="playModel()" class="w-full bg-slate-100 py-3 rounded-xl font-bold text-slate-700 border border-slate-200 active:bg-slate-200">🔊 Listen to Model</button>
                <button id="mainBtn" onclick="handleMic()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg flex justify-center items-center gap-3">
                    <span id="btnText">START RECORDING</span>
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-4">
            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl">
                <div class="flex justify-between items-start mb-4 border-b border-white/10 pb-4">
                    <div>
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Score</p>
                        <h2 id="scorePercent" class="text-5xl font-black text-blue-400">0%</h2>
                    </div>
                    <div class="text-right max-w-[50%]">
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Heard</p>
                        <p id="heardText" class="italic text-slate-300 text-xs mt-1">...</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <audio id="player" controls class="h-8 flex-grow"></audio>
                    <a id="downloadBtn" class="bg-blue-600 p-2 rounded-lg text-[10px] font-bold">SAVE</a>
                </div>
            </div>
            <button onclick="changeSentence()" class="w-full bg-white border-2 border-slate-200 py-4 rounded-2xl font-bold text-slate-600 active:bg-slate-50">Next Sentence ➔</button>
        </div>
    </div>

    <script>
        // --- 1. THE ONLY LIST YOU NEED TO UPDATE ---
        const conversation = [
            "The quick brown fox jumps over the lazy dog.",
            "I'm looking forward to our meeting later this afternoon.",
            "Would you like to grab a cup of coffee tomorrow?",
            "Consistency is more important than perfection.",
            "I really appreciate your help with this project."
        ];

        let currentIdx = 0;
        let isRecording = false;
        let mediaRec;
        let chunks = [];
        let stream;

        // --- 2. THE SYNC ENGINE ---
        function updateUI() {
            // This ensures text always matches the index
            const text = conversation[currentIdx];
            document.getElementById('targetDisplay').innerText = `"${text}"`;
            document.getElementById('lessonInfo').innerText = `Sentence ${currentIdx + 1} of ${conversation.length}`;
            document.getElementById('streakDisplay').innerText = localStorage.getItem('hero_streak') || 0;
        }

        function playModel() {
            window.speechSynthesis.cancel();
            // SYNC: We pull text directly from the UI to ensure they match
            const textToSpeak = document.getElementById('targetDisplay').innerText;
            const msg = new SpeechSynthesisUtterance(textToSpeak);
            msg.lang = 'en-US'; 
            msg.rate = 0.85; 
            window.speechSynthesis.speak(msg);
        }

        async function handleMic() {
            const btn = document.getElementById('mainBtn');
            const txt = document.getElementById('btnText');
            
            if (!isRecording) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRec = new MediaRecorder(stream);
                    chunks = [];
                    mediaRec.ondataavailable = e => chunks.push(e.data);
                    mediaRec.onstop = () => {
                        const blob = new Blob(chunks, { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        document.getElementById('player').src = url;
                        document.getElementById('downloadBtn').href = url;
                        document.getElementById('downloadBtn').download = `practice_${currentIdx}.wav`;
                    };
                    mediaRec.start();
                    isRecording = true;
                    btn.classList.add('record-active');
                    txt.innerText = "STOP RECORDING";
                    document.getElementById('resultArea').classList.add('hidden');
                } catch (e) { alert("Mic required"); }
            } else {
                mediaRec.stop();
                stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                btn.classList.remove('record-active');
                txt.innerText = "START RECORDING";
                runScoring();
            }
        }

        function runScoring() {
            const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
            const rec = new Speech();
            rec.lang = 'en-US';
            rec.onresult = (e) => {
                const heard = e.results[0][0].transcript;
                // SYNC: Again, we compare heard text against the UI'S current text
                const target = conversation[currentIdx].toLowerCase().replace(/[^\w\s]/gi, '');
                const input = heard.toLowerCase().replace(/[^\w\s]/gi, '');
                
                const tWords = target.split(/\s+/);
                const iWords = input.split(/\s+/);
                const matches = tWords.filter(w => iWords.includes(w)).length;
                const score = Math.round((matches / tWords.length) * 100);

                document.getElementById('heardText').innerText = `"${heard}"`;
                document.getElementById('scorePercent').innerText = score + "%";
                document.getElementById('resultArea').classList.remove('hidden');
                if(score > 40) updateStreak();
            };
            rec.start();
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (localStorage.getItem('hero_date') !== today) {
                let s = parseInt(localStorage.getItem('hero_streak') || 0) + 1;
                localStorage.setItem('hero_streak', s);
                localStorage.setItem('hero_date', today);
                updateUI();
            }
        }

        function changeSentence() {
            currentIdx = (currentIdx + 1) % conversation.length;
            updateUI();
            document.getElementById('resultArea').classList.add('hidden');
        }

        // Run on load
        updateUI();
    </script>
</body>
</html>
