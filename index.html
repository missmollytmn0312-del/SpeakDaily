<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Hero | Live Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 pb-12">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <h1 class="font-bold text-slate-800">Speaking Pro</h1>
            <div class="bg-orange-500 text-white px-3 py-1 rounded-full text-sm font-bold">
                🔥 Streak: <span id="streakCount">0</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200">
            <div class="bg-indigo-50 p-6 rounded-2xl mb-6 min-h-[100px] flex items-center justify-center">
                <p id="targetText" class="text-xl font-medium text-indigo-900 text-center italic leading-relaxed">"Press Next to Start"</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="playAI()" class="bg-slate-200 hover:bg-slate-300 py-4 rounded-2xl font-bold text-slate-700 transition">🔊 Listen</button>
                <button id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg transition select-none">
                    🎤 Hold to Speak
                </button>
            </div>

            <button onclick="nextSentence()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-900 transition">
                Next Sentence ➔
            </button>

            <div id="resultArea" class="hidden mt-6 pt-4 border-t border-slate-100 animate-pulse">
                <div class="text-xs text-slate-400 font-bold uppercase mb-1">Accuracy</div>
                <div id="scoreText" class="text-4xl font-black text-blue-600">0%</div>
                <p id="userTranscript" class="text-xs text-slate-500 mt-1"></p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>📁 Your Voice Recordings</span>
            </h3>
            <div id="gallery" class="space-y-3">
                <p class="text-slate-400 text-sm italic text-center">Recordings will appear here...</p>
            </div>
        </div>
    </div>

    <script>
        const dailySentences = [
            "I'm looking forward to our meeting later this afternoon.",
            "Could you please repeat that? I didn't quite catch what you said.",
            "Consistency is more important than perfection.",
            "The journey of a thousand miles begins with a single step.",
            "I really appreciate your help with this project."
        ];

        let currentIndex = 0;
        let mediaRecorder;
        let audioChunks = [];
        let streak = localStorage.getItem('dailyStreak') || 0;
        document.getElementById('streakCount').innerText = streak;

        // --- Fix for Listen Button ---
        function playAI() {
            window.speechSynthesis.cancel(); // Stop any current speech
            const msg = new SpeechSynthesisUtterance(dailySentences[currentIndex]);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        // --- Real Audio Recording Logic ---
        async function startRecording() {
            audioChunks = [];
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                addVoiceToGallery(audioUrl, dailySentences[currentIndex]);
            };

            // Speech Recognition (for scoring)
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRec();
            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                showScore(speech);
            };

            mediaRecorder.start();
            rec.start();
            
            document.getElementById('micBtn').innerText = "🔴 Recording...";
            document.getElementById('micBtn').classList.replace('bg-blue-600', 'bg-red-500');
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                document.getElementById('micBtn').innerText = "🎤 Hold to Speak";
                document.getElementById('micBtn').classList.replace('bg-red-500', 'bg-blue-600');
            }
        }

        function showScore(speech) {
            const target = dailySentences[currentIndex].toLowerCase().replace(/[^\w\s]/gi, '');
            const input = speech.toLowerCase().replace(/[^\w\s]/gi, '');
            const matches = target.split(' ').filter(w => input.includes(w)).length;
            const score = Math.round((matches / target.split(' ').length) * 100);

            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('scoreText').innerText = score + "%";
            document.getElementById('userTranscript').innerText = "Heard: " + speech;
            updateStreak();
        }

        function addVoiceToGallery(url, title) {
            const gallery = document.getElementById('gallery');
            if (gallery.innerHTML.includes("Recordings will appear")) gallery.innerHTML = "";

            const row = document.createElement('div');
            row.className = "p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2";
            row.innerHTML = `
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${title}</p>
                <audio src="${url}" controls class="w-full h-8"></audio>
            `;
            gallery.prepend(row);
        }

        function nextSentence() {
            currentIndex = (currentIndex + 1) % dailySentences.length;
            document.getElementById('targetText').innerText = `"${dailySentences[currentIndex]}"`;
            document.getElementById('resultArea').classList.add('hidden');
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (localStorage.getItem('lastDate') !== today) {
                streak++;
                localStorage.setItem('dailyStreak', streak);
                localStorage.setItem('lastDate', today);
                document.getElementById('streakCount').innerText = streak;
            }
        }

        // Init
        nextSentence();
    </script>
</body>
</html>
