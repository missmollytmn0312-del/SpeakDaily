<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Voice Practice</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 16px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button.primary { background: #3b82f6; color: white; }
    button.danger { background: #ef4444; color: white; }
    button.warn { background: #f59e0b; color: white; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .score { font-size: 1.2rem; font-weight: bold; color: green; }
    .heard span.matched { color: green; font-weight: bold; }
    .heard span.missed { color: red; }
  </style>
</head>
<body>
  <h1>🎤 Daily Voice Practice</h1>
  <div class="card">
    <div><strong>Day Streak:</strong> <span id="streak">0</span> days</div>
    <div><strong>Today's Sentence:</strong> <span id="sentence">Loading...</span></div>
    <button id="speakBtn" class="primary">🔊 Speak</button>
    <button id="nextBtn" class="warn">⏭️ Next Sentence</button>
  </div>

  <div class="card">
    <button id="recordBtn" class="primary">🎙️ Record</button>
    <button id="stopBtn" class="danger" disabled>⏹️ Stop</button>
    <div><strong>Accuracy:</strong> <span id="score" class="score">0%</span></div>
    <div class="heard" id="heardText"></div>
  </div>

  <div class="card">
    <button id="playBtn">▶️ Play Recording</button>
    <button id="downloadBtn">⬇️ Download</button>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    const sentences = [
      "Good morning! How are you today?",
      "I would like a cup of tea.",
      "Can you help me find the station?",
      "The weather is sunny and warm.",
      "Let’s practice English together.",
      "What time is your appointment?",
      "I’m learning Vietnamese every day."
    ];

    const sentenceEl = document.getElementById("sentence");
    const streakEl = document.getElementById("streak");
    const heardEl = document.getElementById("heardText");
    const scoreEl = document.getElementById("score");
    const audioPlayer = document.getElementById("audioPlayer");

    let currentSentence = "";
    let recognition;
    let mediaRecorder;
    let chunks = [];
    let recognizedText = "";

    function getTodayIndex() {
      const start = new Date("2025-01-01");
      const today = new Date();
      const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      return diff % sentences.length;
    }

    function updateStreak() {
      const today = new Date().toISOString().slice(0, 10);
      const last = localStorage.getItem("lastDate");
      let streak = parseInt(localStorage.getItem("streak") || "0");
      if (last !== today) {
        streak = last ? streak + 1 : 1;
        localStorage.setItem("lastDate", today);
        localStorage.setItem("streak", streak);
      }
      streakEl.textContent = streak;
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.speak(utter);
    }

    function tokenize(text) {
      return text.toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/);
    }

    function compareAccuracy(target, heard) {
      const targetWords = tokenize(target);
      const heardWords = tokenize(heard);
      const matched = targetWords.filter(word => heardWords.includes(word));
      const percent = Math.round((matched.length / targetWords.length) * 100);
      scoreEl.textContent = percent + "%";

      heardEl.innerHTML = targetWords.map(word =>
        heardWords.includes(word)
          ? `<span class="matched">${word}</span>`
          : `<span class="missed">${word}</span>`
      ).join(" ");
    }

    function setupRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert("Speech recognition not supported.");
        return null;
      }
      const r = new SR();
      r.lang = "en-US";
      r.continuous = false;
      r.interimResults = false;
      r.onresult = e => {
        recognizedText = e.results[0][0].transcript;
        compareAccuracy(currentSentence, recognizedText);
      };
      r.onerror = e => console.error("Recognition error:", e);
      return r;
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: "audio/webm" });
          const url = URL.createObjectURL(blob);
          audioPlayer.src = url;
          const a = document.createElement("a");
          a.href = url;
          a.download = "recording.webm";
          document.getElementById("downloadBtn").onclick = () => a.click();
        };
        mediaRecorder.start();
        recognition = setupRecognition();
        if (recognition) recognition.start();
        document.getElementById("recordBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
      } catch (err) {
        alert("Mic access failed. Please allow microphone permission.");
        console.error(err);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (recognition) recognition.stop();
      document.getElementById("recordBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
    }

    function loadSentence() {
      const idx = getTodayIndex();
      currentSentence = sentences[idx];
      sentenceEl.textContent = currentSentence;
    }

    document.getElementById("speakBtn").onclick = () => speak(currentSentence);
    document.getElementById("nextBtn").onclick = () => {
      currentSentence = sentences[(sentences.indexOf(currentSentence) + 1) % sentences.length];
      sentenceEl.textContent = currentSentence;
      heardEl.innerHTML = "";
      scoreEl.textContent = "0%";
    };
    document.getElementById("recordBtn").onclick = startRecording;
    document.getElementById("stopBtn").onclick = stopRecording;
    document.getElementById("playBtn").onclick = () => audioPlayer.play();

    updateStreak();
    loadSentence();
  </script>
</body>
</html>
